services:
  dpi-api:
    image: dpi-engine-api:phase11
    build:
      context: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      DPI_TEMP_DIRECTORY: /tmp/dpi-engine-api
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx512m -XX:ActiveProcessorCount=2 -Djava.io.tmpdir=/tmp"
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=268435456,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 30s
