server.address=127.0.0.1
spring.servlet.multipart.max-file-size=${DPI_MAX_UPLOAD_SIZE:25MB}
spring.servlet.multipart.max-request-size=${DPI_MAX_REQUEST_SIZE:26MB}
spring.servlet.multipart.file-size-threshold=0
dpi.api.max-upload-size=${spring.servlet.multipart.max-file-size}
dpi.api.temp-directory=${DPI_TEMP_DIRECTORY:${java.io.tmpdir}/dpi-engine-api}
dpi.api.max-concurrent-requests=${DPI_MAX_CONCURRENT_REQUESTS:2}
dpi.api.max-workers-per-request=${DPI_MAX_WORKERS_PER_REQUEST:8}
dpi.api.max-total-workers=${DPI_MAX_TOTAL_WORKERS:16}
dpi.api.max-packets=${DPI_MAX_PACKETS:100000}
dpi.api.max-flows=${DPI_MAX_FLOWS:10000}
dpi.api.max-packet-bytes=${DPI_MAX_PACKET_BYTES:262144}
management.endpoints.web.exposure.include=health
spring.jackson.deserialization.fail-on-unknown-properties=true
